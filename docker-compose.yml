version: "3.8"

services:
  localstack:
    container_name: localstack_main
    image: localstack/localstack:3.8.0
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - SERVICES=s3,sqs,dynamodb,lambda,iam
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_EXECUTOR=local
      - EULA=1
      - PERSISTENCE=1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - ".:/app_code"
      # Persist state across docker-compose down / up cycles
      - "./.localstack_data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  api:
    container_name: fastapi_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - PUBLIC_ENDPOINT_URL=http://localhost:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=instagram-images-bucket
      - QUARANTINE_BUCKET_NAME=instagram-images-quarantine
      - DYNAMODB_TABLE_NAME=ImagesMetadata
      - DELETE_QUEUE_URL=http://localstack:4566/000000000000/image-delete-queue
      - UPLOAD_QUEUE_URL=http://localstack:4566/000000000000/image-upload-queue
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app-network

  upload-worker:
    container_name: image_upload_worker
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.upload_processor"]
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=instagram-images-bucket
      - QUARANTINE_BUCKET_NAME=instagram-images-quarantine
      - DYNAMODB_TABLE_NAME=ImagesMetadata
      - UPLOAD_QUEUE_URL=http://localstack:4566/000000000000/image-upload-queue
      - DELETE_QUEUE_URL=http://localstack:4566/000000000000/image-delete-queue
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app-network

  delete-worker:
    container_name: image_delete_worker
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.sqs_processor"]
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=instagram-images-bucket
      - QUARANTINE_BUCKET_NAME=instagram-images-quarantine
      - DYNAMODB_TABLE_NAME=ImagesMetadata
      - DELETE_QUEUE_URL=http://localstack:4566/000000000000/image-delete-queue
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge